test_only: False
only_velodyne: False

# Logging: none | tensorboard | wandb
logger_backend: "tensorboard"
logger_log_interval: 10
logger_log_images: true
wandb_project: "gs-lidar"
wandb_entity: null
wandb_run_name: null
scale_factor: 1.0
vfov: null
hfov: null
selected_frames: null
shuffle: True
median_depth: False
lambda_distortion: 0.0
sequence_id: null  # for kitti-360
lidar2ego: null  # 4x4 lidar-to-ego; null uses GACRT014 default in gacrt_loader
pose_frame: null   # imu|ego|lidar; with point_frame=imu/ego forces lidar2ego=I
point_frame: null
intensity_lr: 0.1
lambda_lidar_median: 0.0
lambda_lidar_dssim: 0.0
lambda_depth_opa: 0.0
lambda_normal_consistency: 0.0
lambda_raydrop: 0.0
lambda_intensity: 0.0
lambda_smooth: 0.0
lambda_tv: 0.0
lambda_chamfer: 0.0
lambda_flow_loss: 0.0
lambda_edge_guidance: 0.0
lambda_gs_opa: 0.0
lambda_depth_var: 0.0
dynamic: True
sky_depth: True
raydrop_prior_lr: 0.1

test_iterations: [7000, 30000]
save_iterations: [7000, 30000]
checkpoint_iterations: [7000, 15000, 30000]
exhaust_test: false
test_interval: 5000
render_static: false
vis_step: 500
start_checkpoint: null
seed: 0

# ModelParams
sh_degree: 3
scene_type: "Waymo"
source_path: ???
start_frame: 65  # for kitti 
end_frame: 120  # for kitti
model_path: ???
resolution_scales: [1]
resolution: -1
white_background: false
data_device: "cuda"
eval: false
debug_cuda: false
cam_num: 3  # for waymo
t_init: 0.2
cycle: 0.2
velocity_decay: 1.0
random_init_point: 200000
fix_radius: 0.0
time_duration: [-0.5, 0.5]
num_pts: 100000
frame_interval: 0.02
testhold: 4  # NVS
env_map_res: 1024
separate_scaling_t: 0.1
neg_fov: true

# PipelineParams
convert_SHs_python: false
compute_cov3D_python: false
debug: false
depth_blend_mode: 0
env_optimize_until: 1000000000
env_optimize_from: 0


# OptimizationParams
iterations: 30000
position_lr_init: 0.00016
position_lr_final: 0.0000016
position_lr_delay_mult: 0.01
t_lr_init: 0.0008
position_lr_max_steps: 30_000
feature_lr: 0.0025
opacity_lr: 0.05
scaling_lr: 0.005
scaling_t_lr: 0.002
velocity_lr: 0.001
rotation_lr: 0.001
envmap_lr: 0.01

time_split_frac: 0.5
percent_dense: 0.01
thresh_opa_prune: 0.005
densification_interval: 200
opacity_reset_interval: 3000
densify_from_iter: 500
densify_until_iter: 15_000
densify_grad_threshold: 0.0002
densify_grad_abs_threshold: 0.0004
densify_grad_t_threshold: 0.002
densify_until_num_points: 3000000
sh_increase_interval: 1000
scale_increase_interval: 5000
prune_big_point: 1
size_threshold: 20
big_point_threshold: 0.1
t_grad: true
no_time_split: true
contract: true

lambda_dssim: 0.2
lambda_opa: 0.0
lambda_sky_opa: 0.05
lambda_opacity_entropy: 0.05
lambda_inv_depth: 0.001
lambda_self_supervision: 0.5
lambda_t_reg: 0.0
lambda_v_reg: 0.0
lambda_lidar: 0.1
lidar_decay: 1.0
lambda_v_smooth: 0.0

# Hybrid static-background training (GS-LiDAR × XSIM)
# od_mask_gt_loss: strip dynamic points from RV, fill OD silhouettes,
# use static GT for chamfer/smooth/eval, leave OD unsupervised in raydrop.
static_only: false
od_mask_init: false
od_mask_gt_loss: false
od_bbox_scale: 1.15
static_confidence_track: false
od_min_displacement: 0.5
od_min_speed: null

# Multi-source fused lidar. Null = one IMU/ego panorama, all points as input.
# source: 0=OT128 top, 1=QT128 left, 2=right, 3=front, 4=back
input_lidar_source: null
ego_near_radius: 2.5              # drop points near IMU/ego origin
ego_body_aabb: null               # [[xmin,xmax],[ymin,ymax],[zmin,zmax]] in IMU/ego
ego_body_filter_sources: null     # e.g. [1, 2, 3, 4] = strip body hits from 补盲
# Body ignored in loss. Inference: RV-project that frame's GT AABB points, paste
# over render, decode; re-applied after UNet refine raydrop.
ego_body_infer_replace: true
ego_body_replace_dilate: 2
ego_body_cloud: null              # optional rigid npz; per-frame GT preferred
blind_lidar_origins: false        # one QT128 camera per blind lidar, at that lidar origin
calib_dir: null
n_lidar_sensors: 1                # raydrop priors; 4 when blind_lidar_origins
# Static per-sensor dead zone (blind lidars): pixels hit in < thresh of train frames,
# connected to the RV bottom. Ignored in raydrop loss (plus a dilated edge band),
# forced to drop at inference. Cached as {model_path}/blind_dead_mask.npz.
# Rasterizer near plane (m): Gaussians centred / ray hits closer than this are culled.
# 2.0 suits a roof lidar; bumper-mounted blind lidars observe mostly within 2 m.
raster_near: 2.0
blind_dead_mask: false
blind_dead_thresh: 0.02
blind_dead_col_window: 2          # ± columns; bridges the QT128 azimuth-sampling gaps
blind_dead_bottom_connected: true # exclude open sky / far-field empties
blind_dead_ignore_dilate: 2
# Ring-indexed RV (utils/ring_rv.py; blind_lidar_origins + cam_num=1 only). Geometry
# stays supervised on the uniform hw grid; raydrop, the raydrop prior, the refine UNet
# and the output cloud use one row per laser ring at that ring's native azimuth step.
# Needs a `ring` field in the PCD. Ring elevations/steps are estimated from the data
# and cached as {model_path}/ring_lut.npz.
ring_rv: false
ring_n_rings: 128
ring_interp_rel_thresh: 0.1       # bilinear across taps within 10% depth, else nearest
