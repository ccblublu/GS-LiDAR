# GACRT config for sequence GACRT014_1740908194
# Pandar128: 128 channels, vfov=[-25,15], hfov=[-180,180], horizontal 0.2° resolution
# Dynamic scene config (moving vehicles, pedestrians, etc.)
# All sweeps expanded (206 frames, 0.1s interval)
# Auto-generated by preprocess/gacrt_to_gs.py

exhaust_test: false

# ModelParams
scene_type: "Gacrt"
resolution_scales: [ 1, 2, 4 ]
scale_increase_interval: 5000
cam_num: 2
eval: True
separate_scaling_t: 0.2

sequence_id: "GACRT014_1740908194"
pkl_path: "data/GACRT014_1740908194.pkl"
keyframes_only: false
vfov: [ -25.0, 15.0 ]
hfov: [ -90, 90 ] # 半球
hw: [ 128, 900 ]


# OptimizationParams
iterations: 30000

densify_until_iter: 15000
densify_grad_threshold: 1e-4
sh_increase_interval: 2000

lambda_lidar: 1e1
lambda_lidar_median: 1e1
lidar_decay: 0

only_velodyne: True
lambda_intensity: 0.05
lambda_intensity_sh: 0.05
lambda_raydrop: 0.05
lambda_smooth: 1e-3
lambda_chamfer: 1e-1
lambda_distortion: 1e-2
lambda_normal_consistency: 1e-1
thresh_opa_prune: 0.1

test_iterations: [ 3000, 7000, 15000, 30000 ]
random_init_point: 0
dynamic: True
sky_depth: False

opacity_lr: 0.05
velocity_lr: 0.001
time_split_frac: 1.0
lambda_self_supervision: 0.5
lambda_v_reg: 1e0
t_init: 0.006

num_pts: 3000000
densify_until_num_points: 10000000

# OD-enhanced dynamic optimization
use_od_labels: false
od_dynamic_labels: [0, 1, 2, 5, 7]   # car, truck, bus, pedestrian, bicycle
lambda_v_reg_static: 1e1               # strong: push static velocity to zero
lambda_v_reg_dynamic: 1e-3             # weak: allow dynamic objects to move freely
od_velocity_init: true                 # initialize velocity from OD tracking
od_min_displacement: 0.5               # min displacement (m) to classify as moving
