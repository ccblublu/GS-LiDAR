# Static parking training for GACRT025 underground lot.
# Poses are ego2world (SLAM); points are lidar_demotion/top in vehicle body frame.

exhaust_test: false

source_path: "data"
model_path: "eval_output/gacrt_reconstruction/GACRT025_1757941510"

scene_type: "Gacrt"
sequence_id: "GACRT025_1757941510"
keyframes_only: false

resolution_scales: [1, 2, 4]
scale_increase_interval: 5000
cam_num: 2
eval: True
separate_scaling_t: 0.2

vfov: [-25.0, 15.0]
hfov: [-90, 90]
hw: [128, 900]

# GACRT025 lidar-top-to-car (from calib_extract/calib_lidar_top_to_car.json)
lidar2ego:
  - [-0.007099180444996747, -0.99997479563358083, -9.8664014352449394e-05, 0.63424081795023923]
  - [0.99997257730621436, -0.0070993726824482069, 0.0021079713192554052, 0.0037494479103850867]
  - [-0.002108618641782108, -8.369643995112419e-05, 0.99999777335868578, 2.0345707189655329]
  - [0.0, 0.0, 0.0, 1.0]

iterations: 50000
densify_until_iter: 15000
densify_grad_threshold: 1e-4
sh_increase_interval: 2000

lambda_lidar: 1e1
lambda_lidar_median: 1e1
lidar_decay: 0
only_velodyne: True
lambda_intensity: 0.05
lambda_intensity_sh: 0.05
lambda_raydrop: 0.05
lambda_smooth: 1e-3
lambda_chamfer: 1e-1
lambda_distortion: 1e-2
lambda_normal_consistency: 1e-1
thresh_opa_prune: 0.1

test_iterations: [3000, 7000, 15000, 30000, 50000]
random_init_point: 0
dynamic: false
sky_depth: false

opacity_lr: 0.05
velocity_lr: 0.001
lambda_self_supervision: 0.0
lambda_v_reg: 1e0
lambda_v_reg_static: 1e1
lambda_v_reg_dynamic: 1e-3
t_init: 0.006

num_pts: 3000000
densify_until_num_points: 10000000

static_only: true
od_mask_init: false
od_mask_gt_loss: false
static_confidence_track: false
use_od_labels: false
